services:
  - type: web
    name: sync-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: sync
      - key: SYNC_USERNAME
        sync: false
      - key: SYNC_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
